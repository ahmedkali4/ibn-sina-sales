<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الإدارة - منظومة ابن سينا</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at 50% 20%, #134074 0%, #0b2545 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .login-card {
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 35px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
        }

        .btn-teal {
            background: linear-gradient(135deg, #0d9488 0%, #10b981 100%);
            color: #ffffff;
            font-weight: 700;
            border: none;
            padding: 12px;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .btn-teal:hover {
            background: linear-gradient(135deg, #0f766e 0%, #059669 100%);
            color: #ffffff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary-subtle text-primary p-3 rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 70px; height: 70px;">
                <i class="fa-solid fa-stethoscope fs-2 text-teal"></i>
            </div>
            <h4 class="fw-bold text-navy mb-1">منظومة ابن سينا</h4>
            <p class="text-muted small">تسجيل دخول بوابة إدارة المبيعات والتراخيص</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2 px-3 small rounded-3 mb-3">
                        <i class="fa-solid fa-circle-exclamation me-1"></i> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm" onsubmit="saveAdminFlag()">
            <div class="mb-3">
                <label class="form-label small fw-bold">اسم المستخدم:</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="ahmed" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label small fw-bold">كلمة المرور:</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn btn-teal w-100 fw-bold mb-3">
                <i class="fa-solid fa-right-to-bracket me-1"></i> دخول لوحة الإدارة
            </button>

            <div class="text-center">
                <a href="/" class="text-muted small text-decoration-none">
                    <i class="fa-solid fa-arrow-left me-1"></i> العودة إلى صفحة الهبوط
                </a>
            </div>
        </form>
    </div>

    <script>
        function saveAdminFlag() {
            // Option 1: Store admin token locally so client-side tracking is disabled
            localStorage.setItem('al_tabeeb_admin_token', '1');
            document.cookie = "al_tabeeb_admin=1; path=/; max-age=31536000; SameSite=Lax";
        }
    </script>
</body>
</html>
